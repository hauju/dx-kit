[package]
name = "dx-umami"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Self-hosted Umami analytics for the dx SaaS apps: same-origin proxy for the tracker (ad-blocker bypass), typed client event bridge, session identify, script mount"

[dependencies]
# Always available: privacy hashing for event properties, and JSON building
# for the JS snippets (identify / script mount) so values are escaped safely.
sha2 = "0.10"
hex = "0.4"
serde_json = "1.0"

# Server proxy. rustls, not native-tls — keeps the build off OpenSSL for the
# slim Debian runtime images these apps deploy into (same reasoning as dx-auth).
axum = { version = "0.8.8", optional = true }
reqwest = { version = "0.13.1", default-features = false, features = [
    "rustls",
], optional = true }
tracing = { workspace = true, optional = true }

# The client bridge is target-gated, not feature-gated: on non-wasm targets the
# same functions compile to no-ops, so server builds with feature unification
# never trip over wasm-only imports.
[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window"] }

[features]
default = []
server = ["dep:axum", "dep:reqwest", "dep:tracing"]
