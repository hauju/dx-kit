<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Signing you in…</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
</style>
</head>
<body>
<p id="msg">Signing you in…</p>
<script type="application/json" id="sso-config">__SSO_CONFIG__</script>
<script>
(function () {
  var c = JSON.parse(document.getElementById('sso-config').textContent);
  var msg = document.getElementById('msg');
  function fail(reason) {
    msg.textContent = 'Sign-in failed (' + reason + '). ';
    var a = document.createElement('a');
    a.href = c.restart_url;
    a.textContent = 'Try again';
    msg.appendChild(a);
  }
  // Redeemed from the browser so FerrisKey's identity cookie lands here.
  fetch(c.token_url, {
    method: 'POST',
    credentials: 'include',
    body: new URLSearchParams({
      grant_type: 'authorization_code',
      client_id: c.client_id,
      code: c.code,
      redirect_uri: c.redirect_uri,
      code_verifier: c.code_verifier
    })
  })
    .then(function (r) { if (!r.ok) { throw new Error('token ' + r.status); } return r.json(); })
    .then(function (t) {
      return fetch(c.complete_url, {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ id_token: t.id_token })
      });
    })
    .then(function (r) { if (!r.ok) { throw new Error('complete ' + r.status); } return r.json(); })
    .then(function (j) { location.replace(j.redirect_url); })
    .catch(function (e) { fail(e && e.message ? e.message : String(e)); });
})();
</script>
</body>
</html>
