[package]
name = "dx-auth"
# Pinned ahead of the workspace version: v0.1.1 folds in the rustls reqwest
# build that dx-seo and mistral already carried. Tag and manifest must agree.
version = "0.1.1"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Authentication for the dx SaaS apps: FerrisKey OIDC, custom login UI (passkey/password/email-OTP), sessions, CSRF, and rate limiting"

[dependencies]
# Sibling kit crates (server-only)
crypto = { package = "dx-crypto", path = "../dx-crypto", version = "0.1.0", optional = true }

# Serialization (always needed for shared types)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = { workspace = true }

# Server dependencies
async-trait = { version = "0.1", optional = true }
axum = { version = "0.8.8", optional = true }
tower-sessions = { version = "0.14", default-features = false, features = [
    "axum-core",
], optional = true }
# rustls, not the default native-tls: it keeps the build off OpenSSL, which
# matters for the slim Debian runtime images these apps deploy into. dx-seo and
# mistral had already made this change in their own copies; folding it in here
# is what stops the kit regressing them.
reqwest = { version = "0.13.1", default-features = false, features = [
    "rustls",
    "json",
    "query",
    "form",
], optional = true }
tracing = { workspace = true, optional = true }
jsonwebtoken = { version = "10", features = ["aws_lc_rs"], optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { workspace = true, optional = true }
governor = { version = "0.10", optional = true, features = ["std"] }
chrono = { version = "0.4.43", default-features = false, features = [
    "std",
    "now",
    "serde",
], optional = true }
url = { version = "2.5", optional = true }
captcha-rs = { version = "0.5", optional = true }

# Web dependencies (login page component)
dioxus = { version = "0.7.9", features = ["fullstack", "lib"], optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Window",
    "Request",
    "RequestInit",
    "RequestCredentials",
    "Response",
    "Headers",
] }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
gloo-timers = { version = "0.3.0", features = ["futures"], optional = true }
subtle = "2.6.1"

[features]
default = []
server = [
    "dep:dioxus",
    "dep:async-trait",
    "dep:axum",
    "dep:tower-sessions",
    "dep:reqwest",
    "dep:tracing",
    "dep:chrono",
    "dep:url",
    "dep:crypto",
    "dep:governor",
    "dep:captcha-rs",
    "dep:jsonwebtoken",
    "dep:sha2",
    "dep:base64",
]
web = [
    "dep:dioxus",
    "dep:web-sys",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:serde-wasm-bindgen",
    "dep:gloo-timers",
]
