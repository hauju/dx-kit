[package]
name = "dx-auth"
# Pinned ahead of the workspace version; tag and manifest must agree.
# 0.1.1 folded in the rustls reqwest build. 0.2.0 adds the passkey-rp feature.
# 0.2.1 adds the env-configured bollwark captcha (CAPTCHA_URL / _SITE_KEY /
# _SECRET_KEY), which replaces the image CAPTCHA for new users when set.
# 0.2.2 adds the optional `on_signup` callback on `LoginPage`, fired alongside
# `on_success` when the flow registered a new account (for signup analytics).
# 0.3.1 is dependency maintenance only: jsonwebtoken 11 and gloo-timers 0.4
# (both internal, no API change), plus the lockfile bump that pulls h2 >=0.4.16
# for RUSTSEC-2026-0258.
# 0.4.0 drops the built-in image CAPTCHA and the captcha-rs dependency with it
# (88 transitive crates, and both of the kit's unmaintained-crate advisories).
# Bollwark is now the only captcha: set CAPTCHA_URL / _SITE_KEY / _SECRET_KEY.
# Without them, new-user registration is gated by the allowlist alone, so a
# public deployment must configure bollwark. Removes `POST
# /auth/session/captcha/refresh`, the `captcha_image` response field, and the
# `answer` field on the captcha-verify request.
# 0.5.0 serialises the OTP and password attempt counters per session, so a burst
# of parallel guesses no longer shares one read of the cap, and refuses to move
# an existing account onto a new `sub` unless the IdP marks the email verified.
# Breaking: `AuthUserInfo` gains `email_verified`, and an id_token without an
# `email` claim is rejected instead of resolving to an empty address.
version = "0.5.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Authentication for the dx SaaS apps: FerrisKey OIDC, custom login UI (passkey/password/email-OTP), sessions, CSRF, and rate limiting"

[dependencies]
# Sibling kit crates (server-only)
crypto = { package = "dx-crypto", path = "../dx-crypto", version = "0.1.0", optional = true }

# Serialization (always needed for shared types)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = { workspace = true }

# Server dependencies
async-trait = { version = "0.1", optional = true }
axum = { version = "0.8.8", optional = true }
tower-sessions = { version = "0.14", default-features = false, features = [
    "axum-core",
], optional = true }
# rustls, not the default native-tls: it keeps the build off OpenSSL, which
# matters for the slim Debian runtime images these apps deploy into. dx-seo and
# mistral had already made this change in their own copies; folding it in here
# is what stops the kit regressing them.
reqwest = { version = "0.13.1", default-features = false, features = [
    "rustls",
    "json",
    "query",
    "form",
], optional = true }
tracing = { workspace = true, optional = true }
jsonwebtoken = { version = "11", features = ["aws_lc_rs"], optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { workspace = true, optional = true }
governor = { version = "0.10", optional = true, features = ["std"] }
# rt + time for the rate limiter's idle-bucket sweeper task; sync for the
# per-session attempt-counter locks.
tokio = { version = "1", optional = true, features = ["rt", "time", "sync"] }
chrono = { version = "0.4.43", default-features = false, features = [
    "std",
    "now",
    "serde",
], optional = true }
url = { version = "2.5", optional = true }

# WebAuthn Relying Party (`passkey-rp`). `ring` verifies assertion signatures
# (ES256 / EdDSA / RS256); `ciborium` decodes the COSE key and the CBOR
# attestation object. Both are optional so apps that federate passkeys through
# the IdP never link them.
ring = { version = "0.17", optional = true }
ciborium = { version = "0.2", optional = true }

# Web dependencies (login page component)
dioxus = { version = "0.7.10", features = ["fullstack", "lib"], optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Window",
    "Request",
    "RequestInit",
    "RequestCredentials",
    "Response",
    "Headers",
] }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
gloo-timers = { version = "0.4", features = ["futures"], optional = true }
subtle = "2.6.1"

[dev-dependencies]
# The attempt-counter tests drive real `Session` handles against an in-memory
# store, the way concurrent requests carrying one cookie do in production.
tower-sessions = { version = "0.14", features = ["memory-store"] }
tokio = { version = "1", features = ["macros", "rt"] }

[features]
default = []
server = [
    "dep:dioxus",
    "dep:async-trait",
    "dep:axum",
    "dep:tower-sessions",
    "dep:reqwest",
    "dep:tracing",
    "dep:chrono",
    "dep:url",
    "dep:crypto",
    "dep:governor",
    "dep:tokio",
    "dep:jsonwebtoken",
    "dep:sha2",
    "dep:base64",
]
# This app is its own WebAuthn Relying Party: it runs the ceremonies and stores
# credentials itself, rather than proxying passkeys through the identity
# provider. Needed when accounts can be created by email OTP, since those have
# no IdP user JWT and so can never enroll through the IdP's own endpoints.
#
# Additive, not an alternative: seggwat runs this alongside FerrisKey login.
# Requires `server`, and an `AuthPasskeyStore` on `AuthState`.
passkey-rp = ["server", "dep:ring", "dep:ciborium"]
web = [
    "dep:dioxus",
    "dep:web-sys",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:serde-wasm-bindgen",
    "dep:gloo-timers",
]
